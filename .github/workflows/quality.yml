name: AURIX quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check local site references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import sys

          root = Path('.')
          html_files = [root / 'index.html', root / 'brandbook.html']
          missing = []

          class Parser(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if not value or value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                          continue
                      clean = unquote(urlparse(value).path)
                      if clean.startswith('/downloads/') or clean.startswith('downloads/') or '/downloads/' in clean:
                          continue
                      target = (self.source.parent / clean).resolve()
                      if not target.exists():
                          missing.append(f'{self.source}: {key}={value}')

          for file in html_files:
              parser = Parser(file)
              parser.feed(file.read_text(encoding='utf-8'))

          if missing:
              print('Missing local references:')
              print('\n'.join(missing))
              sys.exit(1)
          print('All local references resolve.')
          PY

      - name: Check brand assets
        run: |
          for file in \
            assets/logos/aurix-discover-stars.svg \
            assets/logos/aurix-discover-stars-white.svg \
            assets/logos/wordmark-purple.svg \
            assets/logos/wordmark-white.svg \
            assets/logos/symbol-purple.svg \
            assets/logos/symbol-white.svg; do
              test -s "$file" || { echo "Missing: $file"; exit 1; }
          done

      - name: Enforce regular-only brand fonts
        run: |
          test -s fonts/guild/GuildA-Display-Regular-Desktop.otf
          test -s "fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf"
          count="$(find fonts -type f | wc -l | tr -d ' ')"
          test "$count" = "2" || { echo "Expected exactly two font files, found $count"; find fonts -type f; exit 1; }
          test "$(find fonts/guild -type f | wc -l | tr -d ' ')" = "1"
          test "$(find fonts/tt-hoves-pro -type f | wc -l | tr -d ' ')" = "1"
