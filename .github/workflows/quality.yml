name: AURIX quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check local site references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import sys

          root = Path('.')
          html_files = [root / 'index.html', root / 'brandbook.html']
          missing = []

          class Parser(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if not value or value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                          continue
                      clean = unquote(urlparse(value).path)
                      target = (self.source.parent / clean).resolve()
                      if not target.exists():
                          missing.append(f'{self.source}: {key}={value}')

          for file in html_files:
              parser = Parser(file)
              parser.feed(file.read_text(encoding='utf-8'))

          if missing:
              print('Missing local references:')
              print('\n'.join(missing))
              sys.exit(1)
          print('All local references resolve.')
          PY

      - name: Check required AURIX logo variants
        run: |
          for file in \
            assets/logos/wordmark-purple.svg \
            assets/logos/wordmark-white.svg \
            assets/logos/wordmark-black.svg \
            assets/logos/symbol-purple.svg \
            assets/logos/symbol-white.svg \
            assets/logos/symbol-black.svg \
            assets/logos/lockup-purple.svg \
            assets/logos/lockup-white.svg \
            assets/logos/lockup-black.svg \
            downloads/AURIX_Logos_All_Versions.svg; do
              test -s "$file" || { echo "Missing: $file"; exit 1; }
          done

      - name: Keep font payloads out of public repository
        run: |
          if find . -type f \( \
            -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o \
            -path './fonts/*.b64' -o -path './fonts/*/*.b64' -o -path './fonts/*/part-*' \
          \) | grep -q .; then
            echo 'Font binaries or encoded font payloads must not be committed to the public repository.'
            exit 1
          fi
